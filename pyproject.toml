# ═══════════════════════════════════════════════════════════════════════════════
# SCRIPTMAN - Python automation made simple
# ═══════════════════════════════════════════════════════════════════════════════

[project]
name = "scriptman"
version = "3.0.0a1"
description = "A powerful Python utilities library for automation, observability, and production-ready scripting."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<4.0"
authors = [
    { name = "Nelson Ombuya", email = "developer@incognitouser.anonaddy.me" },
]
keywords = [
    "automation",
    "scripting",
    "observability",
    "telemetry",
    "caching",
    "configuration",
    "logging",
    "utilities",
    "etl",
    "production",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

# ─────────────────────────────────────────────────────────────────────────────
# Core Dependencies
# ─────────────────────────────────────────────────────────────────────────────

dependencies = [
    "loguru>=0.7.3",   # Structured logging with rich formatting
    "pydantic>=2.0.0", # Config schema validation
]

# ─────────────────────────────────────────────────────────────────────────────
# Optional Dependencies (Extras)
# ─────────────────────────────────────────────────────────────────────────────

[project.optional-dependencies]
# Config format readers
toml = ["tomlkit>=0.13.2"]
yaml = ["pyyaml>=6.0"]
dotenv = ["python-dotenv>=1.0"]

# Bundle all config formats
config-all = ["tomlkit>=0.13.2", "pyyaml>=6.0", "python-dotenv>=1.0"]

# Web/API features
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0"]

# All optional features
all = [
    "tomlkit>=0.13.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

# Development (for contributors)
# Note: Ruff handles formatting + linting + import sorting
# Includes toml/yaml/dotenv for testing config readers
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.8",
    "tomlkit>=0.13.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

# ─────────────────────────────────────────────────────────────────────────────
# CLI Entry Points
# ─────────────────────────────────────────────────────────────────────────────

[project.scripts]
scriptman = "scriptman.cli:main"

# ─────────────────────────────────────────────────────────────────────────────
# Project URLs
# ─────────────────────────────────────────────────────────────────────────────

[project.urls]
Homepage = "https://github.com/nelsonombuya/scriptman"
Documentation = "https://github.com/nelsonombuya/scriptman#readme"
Repository = "https://github.com/nelsonombuya/scriptman"
Issues = "https://github.com/nelsonombuya/scriptman/issues"
Changelog = "https://github.com/nelsonombuya/scriptman/blob/main/CHANGELOG.md"


# ═══════════════════════════════════════════════════════════════════════════════
# BUILD SYSTEM
# ═══════════════════════════════════════════════════════════════════════════════

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


# ═══════════════════════════════════════════════════════════════════════════════
# TOOL CONFIGURATIONS
# ═══════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# Ruff (Linter + Formatter + Import Sorting)
# https://docs.astral.sh/ruff/
# Ruff replaces: Black, isort, Flake8, pyupgrade, and more
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 90
target-version = "py312"
exclude = [".venv", ".git", "__pycache__", "dist", "build", ".data"]

# Linting rules
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "ARG001", # unused function argument
]

# Import sorting (replaces isort)
[tool.ruff.lint.isort]
known-first-party = ["scriptman"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

# Formatter (replaces Black)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ─────────────────────────────────────────────────────────────────────────────
# MyPy (Type Checking)
# ─────────────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_no_return = true
warn_unreachable = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

# Per-module overrides
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ─────────────────────────────────────────────────────────────────────────────
# Pytest (Testing)
# ─────────────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=scriptman",
    "--cov-report=term-missing",
    "--cov-report=html:coverage_html",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# ─────────────────────────────────────────────────────────────────────────────
# Coverage (Test Coverage)
# ─────────────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["scriptman"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]


# ═══════════════════════════════════════════════════════════════════════════════
# POETRY (for dev workflow)
# ═══════════════════════════════════════════════════════════════════════════════
# Note: Poetry groups are used for development workflow.
# Production dependencies are in [project.dependencies] above.

[tool.poetry.group.dev.dependencies]
mypy = "^1.13.0"
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
ruff = "^0.9.8"
