[project]
name = "scriptman"
version = "3.0.0.0alpha1"
description = "A powerful Python package for automation, script management, and workflow orchestration."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
authors = [
    { name = "Nelson Ombuya", email = "developer@incognitouser.anonaddy.me" },
]
dependencies = ["loguru>=0.7.3", "tomlkit>=0.13.2"]

[project.scripts]
scriptman = "scriptman.cli:main"

# Development dependency groups (used only during development)
[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.13.0"
poetry = "^2.2.0"
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"

[tool.poetry.group.lint.dependencies]
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.13.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
pytest-asyncio = "^0.25.0"

# Formatting & Linting Configuration
[tool.black]
line-length = 90
target-version = ["py312", "py313"]

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
check_untyped_defs = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
